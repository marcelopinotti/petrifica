server:
  port: 8082

spring:
  mvc:
    problemdetails:
      enabled: true
  datasource:
    url: jdbc:postgresql://localhost:5432/petrifica
    username: petrifica
    password: petrifica

  jpa:
    hibernate:
      ddl-auto: update
    properties:
      hibernate:
        format_sql: true
        driver-class-name: org.postgresql.Driver

  flyway:
    enabled: true
    locations: classpath:db/migration


  security:
    oauth2:
      resource-server:
        jwt:
          issuer-uri: http://localhost:8080/realms/petrifica

  kafka:
    bootstrap-servers: localhost:9092

management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      show-details: always

kafka:
  topics:
    input: loan-topic
    output: fraud-topic
  group: fraud-group

mongock:
  migration-scan-package:
    - com.marcelo.fraud.migration
